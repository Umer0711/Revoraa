<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Revoraa Logo Exporter</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    canvas { background-color: transparent; border: 1px dashed #555; margin-top: 20px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 16px; background: #f59e0b; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #d97706; }
  </style>
</head>
<body>
  <h1>Revoraa Logo Exporter</h1>
  <p>Your high-resolution PNG is ready to download.</p>
  <canvas id="canvas" width="1024" height="1024"></canvas>
  <button id="downloadBtn">Download PNG</button>

  <script>
    const svgString = `
<svg width="1024" height="1024" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 28 L 8 12 L 16 4 L 24 12 L 16 20 L 8 20" />
    <path d="M 16 20 L 24 28" />
  </g>
</svg>`;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const DOMURL = window.URL || window.webkitURL || window;

    const img = new Image();
    const svg = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
    const url = DOMURL.createObjectURL(svg);

    img.onload = function() {
      ctx.drawImage(img, 0, 0);
      DOMURL.revokeObjectURL(url);
    };
    img.src = url;

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const pngUrl = canvas.toDataURL("image/png");
      const downloadLink = document.createElement("a");
      downloadLink.href = pngUrl;
      downloadLink.download = "revoraa-logo.png";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    });
  </script>
</body>
</html>
